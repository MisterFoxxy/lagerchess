
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Смена 17 августа — список участников</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .btn-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      background: #D96B1C;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    .btn:hover {
      background: #C36019;
    }

    #avg {
      text-align: center;
      margin-top: 6px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }

    th {
      background: #f4f4f4;
      cursor: pointer;
    }

    @media(max-width: 480px) {
      body {
        font-size: 12px;
        padding: 10px;
      }

      th,
      td {
        padding: 4px;
        font-size: 10px;
      }

      .btn {
        flex: 1 1 auto;
        min-width: 140px;
      }
    }
  </style>
</head>
<body>
  <h2>Выберите смену</h2>

  <div class="btn-container">
    <button class="btn" onclick="filter('25 октября - 31 октября')">25 октября - 31 октября</button>
  </div>

  <div id="avg"></div>

  <table id="tab">
    <thead>
      <tr id="hdr"></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    var data = [{"group":"25 октября - 31 октября","fullName":"Фесенко Иван Олегович","birth":"2015","id":"703775","rt":"1581"},{"group":"25 октября - 31 октября","fullName":"Степаненко Марья Анатольевна","birth":"2010","id":"302366","rt":"1436"},{"group":"25 октября - 31 октября","fullName":"Давлетшин  Тимур  Ильдарович","birth":"2015","id":"710708","rt":"1409"},{"group":"25 октября - 31 октября","fullName":"Рубайлов  Дмитрий Михайлович","birth":"2014","id":"475337","rt":"1356"},{"group":"25 октября - 31 октября","fullName":"Наркевич  Елизавета  Леонидовна","birth":"2015","id":"762305","rt":"1316"},{"group":"25 октября - 31 октября","fullName":"Згурская Варвара Николаевна","birth":"2018","id":"769384","rt":"1150"}];
    var grp = '25 октября - 31 октября';
    var col = 'rt';
    var asc = false;

    function sortBy(c) {
      if (col === c) {
        asc = !asc;
      } else {
        col = c;
        asc = false;
      }

      render();
    }

    function filter(g) {
      grp = g;
      col = 'rt';
      asc = false;

      render();
    }

    function render() {
      var hdr = document.getElementById('hdr');

      hdr.innerHTML = [
        '<th>#</th>',
        '<th onclick="sortBy(\'fullName\')">ФИО</th>',
        '<th onclick="sortBy(\'id\')">ID</th>',
        '<th onclick="sortBy(\'birth\')">Год рожд.</th>',
        '<th onclick="sortBy(\'rt\')">Рейтинг</th>'
      ].join('');

      var body = document.querySelector('#tab tbody');
      body.innerHTML = '';

      var filtered = data.filter(function(p) {
        return !grp || p.group === grp;
      });

      // Средний рейтинг: учитываем только числовые значения
      var sum = 0;
      var cnt = 0;

      for (var k = 0; k < filtered.length; k++) {
        var n = parseFloat(filtered[k].rt);

        if (!isNaN(n)) {
          sum += n;
          cnt++;
        }
      }

      var avg = cnt ? Math.round(sum / cnt) : 0;

      document.getElementById('avg').textContent =
        'Средний рейтинг: ' + avg + ' (участников: ' + filtered.length + ')';

      filtered
        .sort(function(a, b) {
          var A = a[col] || '';
          var B = b[col] || '';

          var nA = parseFloat(A);
          var nB = parseFloat(B);

          if (!isNaN(nA) && !isNaN(nB)) {
            return asc ? nA - nB : nB - nA;
          }

          if (A < B) return asc ? -1 : 1;
          if (A > B) return asc ? 1 : -1;

          return 0;
        })
        .forEach(function(p, i) {
          body.insertAdjacentHTML('beforeend',
            '<tr>' +
              '<td>' + (i + 1) + '</td>' +
              '<td>' + (p.fullName || '') + '</td>' +
              '<td>' + (p.id || '') + '</td>' +
              '<td>' + (p.birth || '') + '</td>' +
              '<td>' + (p.rt || '') + '</td>' +
            '</tr>'
          );
        });
    }

    window.onload = render;
  </script>
</body>
</html>
